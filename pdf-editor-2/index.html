<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Editor 2.0 — Template Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;600;700&family=Roboto:wght@400;500;700&family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   PDF Editor 2.0 — design tokens sampled from the reference screens
   ========================================================================== */
:root{
  --navy:#182236; --navy-2:#182E59; --navy-3:#223150;
  --blue:#1C5BD9; --blue-h:#174FC0; --blue-2:#3874EB; --blue-soft:#F5F8FF; --blue-tint:#E7EEFC;
  --ink:#2D3145; --text:#4A4D63; --muted:#8A8C9C; --muted-2:#71758F;
  --line:#E9EAF5; --line-2:#DFE0EB; --input:#CED0DE; --input-h:#B4B7CB;
  --soft:#F5F6FC; --canvas:#F7F8FC; --seg:#EDEDF7; --white:#fff;
  --red:#CC2132; --err-bg:#FAEDEE; --err:#B22D36;
  --warn-bg:#FCF6F0; --warn:#6B3403; --warn-icon:#964600;
  --info-bg:#EBF2FC; --info:#0076D6; --info-ink:#1F3557;
  --tag-header:#D8863F; --tag-section:#D8863F; --tag-el:#1E53BD; --tag-col:#1E53BD; --tag-elem:#068754; --tag-new:#068754; --tag-page:#1E53BD;
  --hatch:#DFCDFA; --hatch-bg:#F5EFFD; --hatch-pill:#6C39B8;
  --tip:#222536;
  --badge-h-bg:#FAE9C8; --badge-h:#593D04;
  --badge-e-bg:#D7F5E9; --badge-e:#095C3B;
  --badge-s-bg:#FBEFD2; --badge-s:#5E4103;
  --badge-c-bg:#E3ECFB; --badge-c:#1E3F87;
  --track:#D3D3E5;
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --t1:160ms; --t2:240ms; --t3:340ms;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --rail-w:70px; --panel-w:338px; --top-h:47px; --tool-h:44px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:13px;color:var(--text);background:var(--canvas);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg{display:block;flex:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-rows:var(--top-h) 1fr;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 20px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:30}
.title-wrap{display:flex;align-items:center;gap:6px;min-width:0}
.doc-title{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.005em;padding:4px 6px;margin-left:-6px;border-radius:5px;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;transition:background var(--t1),border-color var(--t1)}
.doc-title:hover{background:var(--soft)}
.doc-title-input{font-size:15px;font-weight:600;color:var(--ink);padding:4px 6px;margin-left:-6px;border:1px solid var(--blue);border-radius:5px;outline:0;box-shadow:0 0 0 3px rgba(28,91,217,.12);width:min(360px,46vw)}
.icon-btn.title-edit{color:#1B6DE0;width:26px;height:26px}
.icon-btn.title-edit:hover{color:var(--blue);background:var(--blue-soft)}
.top-actions{display:flex;align-items:center;gap:12px}
.vsep{width:1px;height:18px;background:var(--line-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 16px;border-radius:4px;font-size:12.5px;font-weight:500;white-space:nowrap;transition:background var(--t1),border-color var(--t1),color var(--t1),transform var(--t1) var(--ease),box-shadow var(--t1)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 1px 0 rgba(16,24,40,.06)}
.btn-primary:hover{background:var(--blue-h)}
.btn-secondary{background:#fff;border:1px solid var(--input);color:var(--ink)}
.btn-secondary:hover{border-color:var(--input-h);background:#FBFBFE}
.btn-sm{height:26px;padding:0 10px;font-size:12px}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#B31C2B}
.save-btn{min-width:118px;position:relative;overflow:hidden}
.save-btn .save-label,.save-btn .save-done{transition:transform var(--t2) var(--ease-out),opacity var(--t2)}
.save-btn .save-done{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;transform:translateY(100%);opacity:0}
.save-btn.is-saved .save-label{transform:translateY(-100%);opacity:0}
.save-btn.is-saved .save-done{transform:translateY(0);opacity:1}
.save-btn.is-saved{background:#0E7A4C}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:5px;color:var(--text);transition:background var(--t1),color var(--t1),transform var(--t1) var(--ease)}
.icon-btn:hover:not(:disabled){background:var(--soft);color:var(--ink)}
.icon-btn:active:not(:disabled){transform:scale(.92)}
.icon-btn:disabled{color:#C3C5D3;cursor:default}
.icon-btn.close{color:var(--red)}
.icon-btn.close:hover{background:var(--err-bg);color:var(--red)}

.body{display:grid;grid-template-columns:var(--rail-w) var(--panel-w) minmax(0,1fr);min-height:0}

/* ---------- Rail ---------- */
.rail{background:var(--navy);display:flex;flex-direction:column;align-items:stretch;padding:10px 0;gap:4px;z-index:20}
.rail-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px 8px;color:#fff;font-size:11px;line-height:1.2;text-align:center;position:relative}
.rail-ico{width:30px;height:30px;border-radius:6px;background:var(--navy-2);display:grid;place-items:center;transition:background var(--t2) var(--ease),transform var(--t2) var(--spring),box-shadow var(--t2)}
.rail-item:hover .rail-ico{background:var(--navy-3)}
.rail-item[aria-selected="true"] .rail-ico{background:var(--blue);box-shadow:0 4px 12px -4px rgba(28,91,217,.7)}
.rail-item:active .rail-ico{transform:scale(.9)}
.rail-item .rail-lbl{opacity:.92}
.rail-item[aria-selected="true"] .rail-lbl{opacity:1;font-weight:500}
.rail-item:focus-visible{outline:none}
.rail-item:focus-visible .rail-ico{outline:2px solid #8FB2FF;outline-offset:2px}

/* ---------- Side panel ---------- */
.panel{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative;z-index:10}
.panel-head{height:var(--tool-h);flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px 0 20px;border-bottom:1px solid var(--line)}
.panel-title{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;color:var(--ink);margin:0}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;font-size:11.5px;font-weight:500}
.badge-header{background:var(--badge-h-bg);color:var(--badge-h)}
.badge-element{background:var(--badge-e-bg);color:var(--badge-e)}
.badge-section{background:var(--badge-s-bg);color:var(--badge-s)}
.badge-column{background:var(--badge-c-bg);color:var(--badge-c)}
.crumbs{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:2px;padding:0 20px;min-height:30px;background:var(--soft);font-size:11.5px;color:var(--text)}
.crumb{padding:2px 3px;border-radius:3px;color:var(--text);transition:background var(--t1),color var(--t1)}
.crumb:hover{background:#E8EAF5;color:var(--ink)}
.crumb[aria-current="true"]{font-weight:600;color:var(--ink);pointer-events:none}
.crumb-sep{color:#A5A8B8}
.panel-body{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#D6D8E5 transparent}
.panel-body::-webkit-scrollbar{width:8px}
.panel-body::-webkit-scrollbar-thumb{background:#D6D8E5;border-radius:8px;border:2px solid #fff}
.panel-inner{padding:4px 20px 40px}
.panel-inner.enter{animation:panelIn var(--t3) var(--ease-out) both}
.panel-inner.enter-soft{animation:fadeIn var(--t2) var(--ease) both}
@keyframes panelIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* groups */
.pg{padding:20px 0 4px}
.pg + .pg{border-top:1px dashed #D5D7E3}
.pg.flush-top{border-top:0}
.pg-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.pg-title{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin:0}
.pg-note{font-size:11.5px;color:var(--muted-2);margin:-8px 0 14px;line-height:1.45}
.link-btn{display:inline-flex;align-items:center;gap:5px;color:var(--blue);font-size:12.5px;font-weight:500;padding:2px 2px;border-radius:4px;transition:color var(--t1)}
.link-btn:hover{color:var(--blue-h);text-decoration:underline;text-underline-offset:2px}
.link-btn svg{transition:transform var(--t2) var(--ease)}
.link-btn:hover svg.spin-on-hover{transform:rotate(-180deg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px;margin-bottom:14px}
.row > .lbl{flex:0 1 auto;max-width:103px;font-size:12.5px;color:var(--text);line-height:1.35}
.row.wide-lbl > .lbl{max-width:210px}
.row > .ctl{flex:1 1 auto;display:flex;justify-content:flex-end;align-items:center;gap:8px;min-width:0}
.row > .ctl.fill > *{flex:1}
.row.stack{flex-direction:column;align-items:stretch;gap:8px}
.row.stack > .ctl{justify-content:flex-start}
.row.stack > .field,.row.stack > .field.grow{flex:none;height:34px;width:100%}
.row.top{align-items:flex-start}
.row.top > .lbl{padding-top:6px}
.hint{font-size:11.5px;color:var(--muted-2);margin:-8px 0 14px 0}
.hint b{color:var(--ink);font-weight:500}
.fill-w{width:100%}

/* inputs */
.field{position:relative;display:flex;align-items:center;height:34px;flex:none;border:1px solid var(--input);border-radius:5px;background:#fff;transition:border-color var(--t1),box-shadow var(--t1);min-width:0}
.field:hover{border-color:var(--input-h)}
.field:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(28,91,217,.12)}
.field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;padding:0 9px;font-size:13px;color:var(--ink)}
.field input::placeholder{color:#A9ACBD}
.field .sfx{padding:0 9px 0 0;color:#9A9DB0;font-size:12px;pointer-events:none}
.field.w-sm{flex:0 0 92px}
.field.w-md{flex:0 0 140px}
.field.w-lg{flex:1 1 185px;max-width:185px}
.field.grow{flex:1}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field .pre{align-self:stretch;display:grid;place-items:center;width:34px;border-right:1px solid var(--input);background:var(--soft);color:var(--muted-2);border-radius:4px 0 0 4px;transition:background var(--t1),color var(--t1)}
.field:focus-within .pre{color:var(--blue);background:var(--blue-soft);border-right-color:#BFD0F5}
.stepper{display:flex;flex-direction:column;align-self:stretch;border-left:1px solid var(--line-2)}
.stepper button{flex:1;width:16px;display:grid;place-items:center;color:var(--muted-2);transition:background var(--t1),color var(--t1)}
.stepper button:hover{background:var(--soft);color:var(--ink)}
.stepper button:active{background:var(--blue-tint)}
.select{position:relative;display:flex;align-items:center;height:34px;border:1px solid var(--input);border-radius:5px;background:#fff;transition:border-color var(--t1),box-shadow var(--t1);min-width:0}
.select:hover{border-color:var(--input-h)}
.select:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(28,91,217,.12)}
.select select{appearance:none;-webkit-appearance:none;border:0;outline:0;background:transparent;height:100%;width:100%;padding:0 28px 0 9px;font-size:13px;color:var(--ink);cursor:pointer;text-overflow:ellipsis}
.select .chev{position:absolute;right:8px;pointer-events:none;color:var(--muted-2)}
.select.w-lg{flex:0 1 185px;width:185px}
.select.w-sm{flex:0 0 86px}
.textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--input);border-radius:5px;padding:8px 9px;font-size:12.5px;line-height:1.6;color:var(--ink);outline:0;transition:border-color var(--t1),box-shadow var(--t1);background:#fff}
.textarea:hover{border-color:var(--input-h)}
.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(28,91,217,.12)}
.readonly-token{display:flex;align-items:center;height:34px;padding:0 9px;border-radius:5px;background:var(--seg);color:var(--ink);font-size:12.5px;width:185px;border:1px solid transparent}

/* toggle */
.tgl{display:inline-flex;align-items:center;gap:8px}
.tgl-state{font-size:13px;color:var(--ink);min-width:22px;text-align:right}
.switch{position:relative;width:28px;height:16px;border-radius:999px;background:var(--track);transition:background var(--t2) var(--ease);flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.22);transition:transform var(--t2) var(--spring),width var(--t1)}
.switch[aria-checked="true"]{background:var(--blue-2)}
.switch[aria-checked="true"]::after{transform:translateX(12px)}
.switch:active::after{width:14px}
.switch[aria-checked="true"]:active::after{transform:translateX(10px)}
.switch:hover{filter:brightness(.97)}

/* segmented */
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:6px;background:var(--seg);height:34px;isolation:isolate}
.seg.fill-w{display:grid}
.seg-ind{position:absolute;z-index:-1;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:4px;background:#fff;box-shadow:0 1px 2px rgba(24,34,54,.1),0 0 0 .5px rgba(24,34,54,.06);transform:translateX(calc(var(--i) * 100%));transition:transform var(--t3) var(--ease-out)}
.seg button{position:relative;padding:0 12px;font-size:12.5px;color:var(--text);border-radius:4px;white-space:nowrap;transition:color var(--t1)}
.seg button[aria-checked="true"],.seg button[aria-selected="true"]{color:var(--ink);font-weight:500}
.seg button:hover{color:var(--ink)}
.seg.lg{height:36px;width:100%;display:grid}
.seg.lg button{font-size:12.5px}

/* icon group (alignment / style) */
.igrp{display:inline-flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--input);border-radius:5px;background:#fff}
.igrp button{width:28px;height:28px;border-radius:4px;display:grid;place-items:center;color:var(--text);transition:background var(--t1),color var(--t1),transform var(--t1) var(--ease)}
.igrp button:hover{background:var(--soft);color:var(--ink)}
.igrp button:active{transform:scale(.9)}
.igrp button[aria-pressed="true"],.igrp button[aria-checked="true"]{background:#E9ECF8;color:var(--ink)}
.igrp.style button[aria-pressed="true"]{background:var(--blue-tint);color:var(--blue)}
.hl-ico{position:relative;display:grid;place-items:center;width:20px;height:20px}
.hl-ico svg{margin-top:-3px}
.hl-ico i{position:absolute;left:4px;right:4px;bottom:2px;height:3px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(24,34,54,.22)}
.swatch-menu{min-width:0;padding:8px}
.sw-row{display:flex;gap:7px;padding:2px 2px 10px}
.hl-sw{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--muted-2);box-shadow:inset 0 0 0 1px rgba(24,34,54,.16);transition:transform var(--t2) var(--spring),box-shadow var(--t1)}
.hl-sw:hover{transform:scale(1.12)}
.hl-sw.on{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--blue-2)}
.sw-custom{display:flex;align-items:center;gap:8px;padding:8px 2px 2px;border-top:1px solid var(--line);font-size:12px;color:var(--text);cursor:pointer}
.sw-custom input{width:22px;height:22px;border:0;padding:0;background:none;cursor:pointer}

/* color */
.color{display:flex;align-items:center;height:34px;border:1px solid var(--input);border-radius:5px;background:#fff;width:185px;flex:0 1 185px;transition:border-color var(--t1),box-shadow var(--t1);min-width:0}
.color:hover{border-color:var(--input-h)}
.color:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(28,91,217,.12)}
.swatch{position:relative;align-self:stretch;width:34px;display:grid;place-items:center;border-right:1px solid var(--line-2);flex:none}
.swatch i{display:block;width:16px;height:16px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(24,34,54,.14);transition:background var(--t2)}
.swatch.is-empty i{background:conic-gradient(#E6E6E5 25%,#fff 0 50%,#E6E6E5 0 75%,#fff 0) 0 0/8px 8px!important}
.swatch input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.color input[type=text]{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0 9px;font-size:13px;color:var(--ink);text-transform:uppercase}
.color input[type=text]::placeholder{text-transform:none;color:var(--ink)}
.color-wrap{display:flex;align-items:center;gap:8px}
.color-wrap:has(.sq-btn) .color{width:143px;flex:0 1 143px}
.sq-btn{width:34px;height:34px;border-radius:5px;border:1px solid var(--input);display:grid;place-items:center;color:var(--text);background:#fff;transition:border-color var(--t1),background var(--t1),color var(--t1),transform var(--t1) var(--ease);flex:none}
.sq-btn:hover{border-color:var(--input-h);color:var(--ink)}
.sq-btn:active{transform:scale(.93)}
.sq-btn.active,.sq-btn[aria-pressed="true"]{border-color:var(--blue-2);background:var(--blue-soft);color:var(--blue)}

/* margin box */
.mbox{position:relative;display:grid;grid-template-columns:56px 1fr 56px;grid-template-rows:auto auto auto;gap:10px 8px;align-items:center;justify-items:center;padding:12px 8px;border-radius:8px;background:var(--soft);border:1px solid #ECEDF6;margin-bottom:14px}
.mbox .mb-in{width:48px;height:34px;border:1px solid var(--input);border-radius:5px;background:#fff;text-align:center;font-size:12.5px;color:var(--ink);outline:0;transition:border-color var(--t1),box-shadow var(--t1),transform var(--t1) var(--ease)}
.mbox .mb-in:hover{border-color:var(--input-h)}
.mbox .mb-in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(28,91,217,.12)}
.mbox .mb-t{grid-column:2;grid-row:1}
.mbox .mb-l{grid-column:1;grid-row:2}
.mbox .mb-r{grid-column:3;grid-row:2}
.mbox .mb-b{grid-column:2;grid-row:3}
.mbox .mb-c{grid-column:2;grid-row:2;justify-self:stretch;height:66px;border:1px dashed #B9BCCF;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10px;letter-spacing:.06em;color:var(--muted-2);font-weight:500}
.mbox .mb-c .ci{width:22px;height:22px;border-radius:5px;background:var(--blue-tint);color:var(--blue);display:grid;place-items:center;border:1px solid #C9D7F6}
.mbox .mb-unit{position:absolute;right:10px;bottom:8px;font-size:10.5px;color:var(--muted)}

/* per-side grid */
.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-4px 0 14px auto;width:185px}
.sides .field{height:30px}
.sides .field .pre{width:30px}

/* reveal (animated show/hide) */
.reveal{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t3) var(--ease-out),opacity var(--t2) var(--ease);opacity:0}
.reveal > .reveal-in{overflow:hidden;min-height:0}
.reveal.open{grid-template-rows:1fr;opacity:1}
.reveal:not(.open) > .reveal-in{visibility:hidden;transition:visibility 0s var(--t3)}
.reveal.open > .reveal-in{visibility:visible}
.reveal-in > :first-child{margin-top:0}
.reveal-pad{padding-top:2px}

/* banners */
.banner{display:flex;align-items:flex-start;gap:7px;padding:7px 10px;border-radius:5px;font-size:12px;line-height:1.45;margin-bottom:14px}
.banner svg{margin-top:1px}
.banner .b-txt{flex:1}
.banner-err{background:var(--err-bg);color:var(--err)}
.banner-warn{background:var(--warn-bg);color:var(--warn)}
.banner-warn svg{color:var(--warn-icon)}
.banner-info{background:var(--info-bg);color:var(--info-ink)}
.banner-info svg{color:var(--info)}
.banner .link-btn{font-size:12px}
.banner.shake{animation:shake .38s var(--ease)}
@keyframes shake{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}

/* cards: header style, choice cards */
.hs-card{display:block;width:100%;border:1px solid var(--line-2);border-radius:6px;background:#fff;padding:8px;margin-bottom:12px;text-align:left;overflow:hidden;transition:border-color var(--t2),box-shadow var(--t2),background var(--t2),transform var(--t2) var(--ease)}
.hs-card:hover{border-color:#C3C8E0;box-shadow:0 2px 6px rgba(24,34,54,.06)}
.hs-card[aria-checked="true"]{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 2px rgba(28,91,217,.14)}
.hs-card:active{transform:scale(.985)}
.hs-card.static{cursor:default}
.hs-card.static:hover{border-color:var(--line-2);box-shadow:none}
.hs-thumb.is-footer{height:44px}
.hs-thumb{position:relative;height:74px;overflow:hidden;border-radius:3px;pointer-events:none;background:#fff}
.hs-thumb-inner{position:absolute;top:4px;left:4px;width:560px;transform-origin:0 0}
.hs-name{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted-2);margin-top:6px}
.hs-name b{font-weight:500;color:var(--ink)}
.dim-rest{opacity:.35;pointer-events:none;filter:saturate(.5);animation:dimIn var(--t3) var(--ease) both}
@keyframes dimIn{from{opacity:1}to{opacity:.35}}
.picker-card{position:relative;z-index:1;margin:14px -10px 18px;padding:14px 10px 4px;border-radius:8px;background:#fff;border:1px solid #C9D7F6;box-shadow:0 1px 3px rgba(28,91,217,.06);animation:liftIn var(--t3) var(--ease-out) both}
@keyframes liftIn{from{transform:translateY(4px);border-color:transparent}to{transform:none}}
.btn.ready{animation:readyPulse 1.8s var(--ease-out) 1}
@keyframes readyPulse{0%{box-shadow:0 0 0 0 rgba(28,91,217,.45)}70%{box-shadow:0 0 0 7px rgba(28,91,217,0)}100%{box-shadow:none}}
.btn:disabled{opacity:.5;cursor:default}
.btn:disabled:active{transform:none}
.hs-picker{animation:panelIn var(--t3) var(--ease-out) both}
.hs-actions{display:flex;gap:8px}

.cc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.cc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:56px;border:1px solid var(--line-2);border-radius:6px;font-size:12px;color:var(--text);background:#fff;box-shadow:0 1px 0 rgba(24,34,54,.03);transition:border-color var(--t2),background var(--t2),color var(--t2),transform var(--t1) var(--ease)}
.cc:hover{border-color:#C3C8E0}
.cc:active{transform:scale(.96)}
.cc[aria-checked="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}

/* list tables (columns) */
.ltable{margin:0 -20px 12px}
.lt-head,.lt-row{display:grid;grid-template-columns:1fr 92px 58px;align-items:center;gap:8px;padding:0 20px}
.lt-head{height:32px;background:var(--soft);font-size:10.5px;white-space:nowrap;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.lt-head span:last-child{text-align:center}
.lt-row{height:48px;position:relative;background:#fff;transition:background var(--t1),opacity var(--t2)}
.lt-row:hover{background:#FBFBFE}
.lt-row.is-hidden .lt-name,.lt-row.is-hidden .field{opacity:.45}
.lt-row.dragging{z-index:2;box-shadow:0 8px 24px -8px rgba(24,34,54,.28),0 0 0 1px var(--line-2);border-radius:6px;background:#fff}
.lt-row.is-selected{background:var(--blue-soft)}
.lt-name{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);min-width:0;transition:opacity var(--t2)}
.lt-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt-name input{border:0;outline:0;background:transparent;font-size:13px;color:var(--ink);min-width:0;flex:1;padding:4px 4px;border-radius:4px;transition:background var(--t1),box-shadow var(--t1)}
.lt-name input:hover{background:var(--soft)}
.lt-name input:focus{background:#fff;box-shadow:0 0 0 1px var(--blue)}
.grip{display:grid;place-items:center;width:16px;height:24px;color:#9A9DB0;cursor:grab;border-radius:3px;touch-action:none;transition:color var(--t1),background var(--t1)}
.grip:hover{color:var(--ink);background:var(--soft)}
.grip:active{cursor:grabbing}
.lt-act{display:flex;align-items:center;justify-content:center;gap:2px}
.lt-act .icon-btn{width:24px;height:24px}
.lt-act .vbar{width:1px;height:12px;background:var(--line-2)}
.lt-row .field{height:34px}
.add-row-btn{display:flex;align-items:center;gap:6px;color:var(--blue);font-size:12.5px;font-weight:500;padding:6px 0;margin-bottom:10px}
.add-row-btn:hover{text-decoration:underline;text-underline-offset:2px}

/* table style cards */
.ts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.ts-card{border:1px solid var(--line-2);border-radius:6px;background:#fff;padding:9px 9px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--text);transition:border-color var(--t2),background var(--t2),color var(--t2),transform var(--t1) var(--ease),box-shadow var(--t2)}
.ts-card:hover{border-color:#C3C8E0;box-shadow:0 2px 6px rgba(24,34,54,.05)}
.ts-card:active{transform:scale(.97)}
.ts-card[aria-checked="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.ts-prev{width:100%;height:76px;border-radius:4px;background:#fff;border:1px solid #ECEDF4;padding:8px 6px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:0;overflow:hidden}
.ts-prev i{display:flex;align-items:center;justify-content:center}
.ts-prev i::before{content:"";width:62%;height:3px;border-radius:2px;background:#CED0DE}
.ts-prev i.h::before{background:var(--acc);height:3.5px}
.ts-prev.grid i{border-right:1px solid #DFE0EB;border-bottom:1px solid #DFE0EB}
.ts-prev.grid{border-left:1px solid #DFE0EB;border-top:1px solid #DFE0EB;padding:0;margin:0}
.ts-prev.striped i.h{background:var(--acc)}
.ts-prev.striped i.h::before{background:#fff;opacity:.85}
.ts-prev.minimal{border-color:#DFE0EB}
.ts-prev.minimal i{border-bottom:1px solid #E6E7EF}
.ts-prev.minimal i.h{background:var(--acc-tint)}
.ts-prev.minimal i.h::before{background:var(--acc);opacity:1}
.ts-prev.nolines i.h::before{background:var(--acc)}
.ts-prev.striped i.z{background:var(--acc-soft)}
.ts-dots{color:#A5A8B8}
.swatches{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform var(--t2) var(--spring),box-shadow var(--t2)}
.sw:hover{transform:scale(1.12)}
.sw[aria-checked="true"]{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--c)}
.sw svg{opacity:0;transform:scale(.4);transition:opacity var(--t1),transform var(--t2) var(--spring)}
.sw[aria-checked="true"] svg{opacity:1;transform:none}

/* tabs inside panel */
.ptabs{margin:2px 0 16px}
.ptabs.divided{margin:6px 0 4px;padding:18px 0 16px;border-top:1px dashed #D5D7E3}
.tabpane{animation:fadeIn var(--t2) var(--ease) both}

/* radios */
.radios{display:flex;gap:12px;white-space:nowrap}
.radio{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);cursor:pointer}
.radio input{appearance:none;-webkit-appearance:none;width:14px;height:14px;border-radius:50%;border:1px solid var(--input);margin:0;display:grid;place-items:center;transition:border-color var(--t1),box-shadow var(--t1);background:#fff;cursor:pointer}
.radio input::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue-2);transform:scale(0);transition:transform var(--t2) var(--spring)}
.radio input:checked{border-color:var(--blue-2)}
.radio input:checked::after{transform:scale(1)}
.radio input:focus-visible{box-shadow:0 0 0 3px rgba(28,91,217,.2);outline:none}

/* checkbox */
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer;user-select:none}
.check input{appearance:none;-webkit-appearance:none;width:14px;height:14px;border-radius:3px;border:1px solid var(--input);margin:0;display:grid;place-items:center;background:#fff;transition:background var(--t1),border-color var(--t1);cursor:pointer}
.check input::after{content:"";width:8px;height:4px;border-left:1.6px solid #fff;border-bottom:1.6px solid #fff;transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform var(--t2) var(--spring)}
.check input:checked{background:var(--blue-2);border-color:var(--blue-2)}
.check input:checked::after{transform:translateY(-1px) rotate(-45deg) scale(1)}

/* search */
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--input);border-radius:5px;margin:14px 0 0;transition:border-color var(--t1),box-shadow var(--t1);color:var(--muted-2)}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(28,91,217,.12)}
.search input{flex:1;border:0;outline:0;font-size:13px;color:var(--ink);background:transparent;min-width:0}
.search input::placeholder{color:#8A8C9C}
.sticky-tools{position:sticky;top:0;background:#fff;z-index:3;margin:0 -20px;padding:16px 20px 14px;border-bottom:1px solid transparent;transition:border-color var(--t2),box-shadow var(--t2)}
.sticky-tools.divided{border-bottom:1px solid var(--line);margin-bottom:4px;padding-bottom:20px}
.tools-check{margin-top:20px;line-height:1}
[data-pane="fields"]{padding-top:24px}
.sticky-tools.scrolled{border-bottom-color:var(--line);box-shadow:0 4px 10px -8px rgba(24,34,54,.18)}

/* insert: component cards */
.comp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.comp{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;height:82px;border:1px solid var(--line-2);border-radius:6px;background:#fff;color:var(--text);font-size:12.5px;line-height:1.2;text-align:center;box-shadow:0 1px 0 rgba(24,34,54,.04);cursor:grab;touch-action:none;user-select:none;transition:border-color var(--t2),background var(--t2),color var(--t2),transform var(--t2) var(--ease),box-shadow var(--t2)}
.comp:hover{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);box-shadow:0 4px 12px -6px rgba(28,91,217,.35)}
.comp:hover .c-ico{color:var(--blue);transform:translateY(-1px)}
.comp:active{cursor:grabbing;transform:scale(.97)}
.comp .c-ico{color:var(--ink);transition:transform var(--t2) var(--spring),color var(--t2)}
.comp .dots{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);color:#A5A8B8}
.comp.is-src{opacity:.4;transform:scale(.97)}
.preset{display:block;width:100%;border:1px solid var(--line-2);border-radius:6px;background:#fff;padding:12px 12px 8px;margin-bottom:10px;cursor:grab;touch-action:none;user-select:none;text-align:center;box-shadow:0 1px 0 rgba(24,34,54,.04);transition:border-color var(--t2),background var(--t2),box-shadow var(--t2),transform var(--t2) var(--ease)}
.preset:hover{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 4px 12px -6px rgba(28,91,217,.3)}
.preset:active{cursor:grabbing;transform:scale(.985)}
.preset.is-src{opacity:.4}
.pz{display:flex;gap:6px;height:40px}
.pz span{display:grid;place-items:center;border:1px dashed #C9CBE0;background:var(--soft);border-radius:3px;font-size:11px;font-weight:600;color:var(--text);transition:border-color var(--t2),background var(--t2)}
.preset:hover .pz span{border-color:#9DB6EE;background:#EEF3FE}
.p-lbl{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--text)}
.preset:hover .p-lbl{color:var(--blue)}
.p-lbl .dots{color:#A5A8B8}
.mini-doc{position:relative;height:54px;overflow:hidden;border-radius:3px;background:#fff;pointer-events:none;border:1px solid #F0F1F7}
.mini-doc-inner{position:absolute;top:6px;left:8px;width:640px;transform-origin:0 0}

/* insert: module field chips */
.fgroup{margin-bottom:26px}
.fgroup h4{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin:0 0 12px}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chip{display:flex;align-items:center;gap:5px;min-width:0;height:34px;padding:0 7px 0 4px;border:1px solid var(--line-2);border-radius:5px;background:#fff;font-size:12px;color:var(--ink);text-align:left;cursor:grab;touch-action:none;user-select:none;transition:border-color var(--t2),background var(--t2),box-shadow var(--t2),transform var(--t1) var(--ease),opacity var(--t2)}
.chip .dots{color:#A5A8B8;flex:none}
.chip span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 3px 10px -6px rgba(28,91,217,.4)}
.chip:active{cursor:grabbing;transform:scale(.97)}
.chip.used{background:var(--canvas);color:var(--muted-2)}
.chip.used .ck{color:var(--blue-2)}
.chip.is-src{opacity:.4}
.empty-search{padding:30px 10px;text-align:center;color:var(--muted-2);font-size:12.5px}

/* properties empty state */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:120px 18px 20px}
.empty h3{font-size:13.5px;font-weight:600;color:var(--ink);margin:18px 0 6px}
.empty p{margin:0;font-size:12.5px;line-height:1.55;color:var(--muted-2);max-width:260px}
.mod-hints{display:flex;flex-direction:column;gap:8px;margin-top:18px;font-size:12px;color:var(--muted-2)}
.mod-hints kbd{display:inline-block;min-width:22px;padding:1px 6px;margin-right:4px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;background:#fff;font-family:var(--font);font-size:11px;color:var(--ink)}
.head-acts{display:flex;align-items:center;gap:2px}
.head-sep{width:1px;height:16px;background:var(--line-2);margin:0 5px}
.empty-illus{animation:float 4.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}

/* image upload preview */
.btn-add{height:34px;padding:0 12px;color:var(--blue);gap:6px}
.nest{width:185px;margin:0 0 14px auto}
.nest-item{padding:12px 0;border-top:1px solid var(--line)}
.nest.first > .nest-item:first-child{border-top:0;padding-top:0}
.nest-lbl{display:block;font-size:12.5px;color:var(--text);margin-bottom:8px}
.nest .range-row,.nest .seg.fill-w,.nest .field.fill-w{width:100%}
.nest .pos-wrap{width:auto;margin:0}
.nest .reveal-pad{padding-top:0}
.img-prev{position:relative;width:185px;height:96px;border:1px solid var(--line-2);border-radius:6px;background:#fff center/contain no-repeat;overflow:hidden}
.img-acts{display:flex;justify-content:space-between;width:185px;margin:8px 0 2px auto;padding-bottom:10px}
.img-acts button{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text);padding:3px 4px;border-radius:4px;transition:color var(--t1),background var(--t1)}
.img-acts button:hover{background:var(--soft);color:var(--ink)}
.img-acts .del{color:var(--red)}
.img-acts .del:hover{background:var(--err-bg);color:var(--red)}
.range-row{display:flex;align-items:center;gap:10px;width:185px}
.range-row .field{flex:0 0 86px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1 1 0;min-width:0;width:100%;height:16px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(var(--blue-2),var(--blue-2)) 0/var(--p,50%) 100% no-repeat,#DADCE8}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:#DADCE8}
input[type=range]::-moz-range-progress{height:3px;border-radius:3px;background:var(--blue-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4.5px;border-radius:50%;background:#fff;border:2px solid var(--blue-2);box-shadow:0 1px 3px rgba(24,34,54,.2);transition:transform var(--t1) var(--ease)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--blue-2)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
.posgrid{display:grid;grid-template-columns:repeat(3,22px);gap:3px;padding:4px;border:1px solid var(--line-2);border-radius:6px;background:#fff}
.posgrid button{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;color:var(--muted-2);transition:background var(--t1),color var(--t1)}
.posgrid button:hover{background:var(--soft);color:var(--ink)}
.posgrid button[aria-checked="true"]{background:var(--blue-soft);color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue-2)}
.pos-wrap{display:flex;align-items:center;gap:14px;width:185px;margin-left:auto}
.pos-label{font-size:12.5px;color:var(--ink)}
.indent-ctl{width:185px;margin-left:auto}

/* rich text editor */
.rte{border:1px solid var(--input);border-radius:6px;background:#fff;transition:border-color var(--t1),box-shadow var(--t1);margin-bottom:14px}
.rte:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(28,91,217,.12)}
.rte-bar{display:flex;align-items:center;gap:1px;padding:5px 5px;border-bottom:1px solid var(--line);flex-wrap:nowrap;background:#FCFCFE;border-radius:6px 6px 0 0}
.rte-bar .icon-btn{width:23px;height:24px;flex:none}
.rte-bar .icon-btn[aria-pressed="true"]{background:var(--blue-tint);color:var(--blue)}
.rte-bar .mini-sel{position:relative;display:flex;align-items:center}
.rte-bar .mini-sel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-size:12px;color:var(--ink);padding:3px 15px 3px 5px;max-width:72px;text-overflow:ellipsis;border-radius:4px;cursor:pointer;outline:0}
.rte-bar .mini-sel select:hover{background:var(--soft)}
.rte-bar .mini-sel .chev{position:absolute;right:2px;pointer-events:none;color:var(--muted-2)}
.rte-bar .sp{flex:1}
.rte-body{min-height:110px;padding:10px 10px 12px;font-size:12.5px;line-height:1.6;color:var(--ink);outline:0;word-break:break-word}
.rte-body .ph,.ph-inline{background:var(--blue-tint);color:var(--blue);border-radius:3px;padding:0 3px;font-size:.95em}

/* popover menu */
.menu{position:fixed;z-index:200;min-width:190px;max-height:320px;overflow:auto;background:#fff;border:1px solid var(--line-2);border-radius:8px;box-shadow:0 12px 32px -8px rgba(24,34,54,.25),0 2px 6px rgba(24,34,54,.06);padding:5px;transform-origin:top left;animation:pop var(--t2) var(--ease-out) both}
.menu.up{transform-origin:bottom left}
.menu .m-lbl{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:7px 9px 4px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border-radius:5px;font-size:12.5px;color:var(--ink);text-align:left;transition:background var(--t1)}
.menu button:hover,.menu button:focus-visible{background:var(--soft);outline:none}
.menu button .m-sub{margin-left:auto;font-size:11px;color:var(--muted)}
.menu .m-sep{height:1px;background:var(--line);margin:4px 2px}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-3px)}to{opacity:1;transform:none}}

/* ---------- Canvas ---------- */
.canvas{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--canvas);position:relative}
.ctool{height:var(--tool-h);flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 18px;background:#fff;border-bottom:1px solid var(--line);z-index:5}
.ctool-l{display:flex;align-items:center;gap:6px}
.ctool .icon-btn{width:26px;height:26px}
.zoom{position:relative;display:flex;align-items:center;height:28px;border:1px solid var(--input);border-radius:5px;transition:border-color var(--t1),box-shadow var(--t1)}
.zoom:hover{border-color:var(--input-h)}
.zoom:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(28,91,217,.12)}
.zoom select{appearance:none;-webkit-appearance:none;border:0;background:transparent;outline:0;height:100%;padding:0 24px 0 9px;font-size:12.5px;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.zoom .chev{position:absolute;right:6px;pointer-events:none;color:var(--muted-2)}
.ctool-r{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:12.5px;color:var(--ink)}
.ctool-title{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1}
.stage-scroll{flex:1;overflow:auto;position:relative;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#D3D6E4 transparent}
.stage-scroll:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.stage{position:relative;min-width:100%;width:max-content;padding:56px 48px 120px;display:flex;flex-direction:column;align-items:center}
#previewTabs{align-self:center;max-width:100%}
.preview-tabs{display:flex;align-items:center;justify-content:flex-start;gap:14px;margin:-30px 0 12px;font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--text);animation:panelIn var(--t3) var(--ease-out) both}
.preview-tabs .seg{height:30px}
.preview-tabs .seg button{text-transform:none;letter-spacing:0;font-size:12.5px;padding:0 16px}
.page-wrap{position:relative;transition:width var(--t3) var(--ease-out),height var(--t3) var(--ease-out)}
.page{cursor:default;user-select:none;-webkit-user-select:none;position:absolute;top:0;left:0;transform-origin:0 0;transition:transform var(--t3) var(--ease-out);background:#fff;box-shadow:0 0 0 1px #E6E8F2,0 1px 3px rgba(24,34,54,.05),0 12px 32px -18px rgba(24,34,54,.18);overflow:hidden}
.overlay{position:absolute;inset:0;pointer-events:none;z-index:6}

/* ---------- Document (inside .page) ---------- */
.doc{position:relative;z-index:1;line-height:1.5;word-break:break-word}
.doc *{box-sizing:border-box}
.doc p{margin:0}
.doc .content-box{position:relative}
.doc-bgimg{position:absolute;inset:0;z-index:0;pointer-events:none}
.doc-pborder{position:absolute;z-index:2;pointer-events:none;border-radius:0}
.doc,.doc *{cursor:default}
.doc b{font-weight:600}
.doc .sec{position:relative}
.doc .sec-row{display:flex;width:100%}
.doc .col{position:relative;min-width:0;display:flex;flex-direction:column}
.doc .el{position:relative}
.doc .el + .el{margin-top:var(--el-gap,8px)}
.doc .col-empty{display:flex;align-items:center;justify-content:center;min-height:72px;border:1px dashed #C9CBE0;border-radius:4px;background:var(--soft);font-family:var(--font);font-size:12px;color:var(--muted-2);transition:border-color var(--t2),background var(--t2),color var(--t2)}
.doc .col-empty .ce-hot{display:none}
.doc .col-empty.drop-hot{border-color:#1E53BD;background:#F0F5FC;color:#1E53BD;font-weight:500}
.doc .col-empty.drop-hot .ce-idle{display:none}
.doc .col-empty.drop-hot .ce-hot{display:inline}
.doc .ph{display:inline;background:#EEF2FD;color:#2753B5;border-radius:3px;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;font-size:.92em}
.doc .h-logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em;color:#2B2F3E}
.doc .h-logo .mark{flex:none;display:grid;place-items:center;border-radius:50%;border:1.6px solid currentColor}
.doc .f-between{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.doc .f-between .f-val{text-align:right}
.doc .f-inline{display:flex;gap:6px;align-items:baseline}
.doc .f-stack .f-lbl{margin-bottom:6px}
.doc table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.doc .tbl{overflow:hidden}
.doc th{font-weight:500;text-align:left}
.doc td,.doc th{vertical-align:top}
.doc .t-desc{display:block;margin-top:3px}
.doc .sig-name{font-family:"Dancing Script","Brush Script MT",cursive;line-height:1.1;color:#2B2F3E}
.doc .sig-line{border-top:1px solid #DFE0EB;margin-top:8px;padding-top:8px}
.doc .img-ph{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--soft);border:1px dashed #C9CBE0;color:var(--muted-2);font-family:var(--font);font-size:12px;border-radius:4px}
.doc .el.flash{animation:flash 1.4s var(--ease) both}
@keyframes flash{0%{background:rgba(28,91,217,.14);box-shadow:0 0 0 6px rgba(28,91,217,.14)}100%{background:transparent;box-shadow:0 0 0 6px transparent}}
.doc .el.flash-new,.doc .sec.flash-new{animation:flashNew 1.8s var(--ease) both}
@keyframes flashNew{0%{background:rgba(6,135,84,.16);box-shadow:0 0 0 5px rgba(6,135,84,.16)}100%{background:transparent;box-shadow:0 0 0 5px transparent}}
.doc .el.inline-edit{outline:1.5px solid var(--tag-el);outline-offset:3px;border-radius:2px;cursor:text}
.doc .el [contenteditable="true"]{outline:0;cursor:text}
.pbreak{position:absolute;left:0;right:0;height:0;border-top:1px dashed #C4C7DA;z-index:3;pointer-events:none}
.pbreak span{position:absolute;right:10px;top:-10px;font-family:var(--font);font-size:10px;font-weight:600;letter-spacing:.04em;color:#7C80A0;background:#fff;padding:2px 6px;border:1px solid #DADCE8;border-radius:999px}

/* ---------- Overlays ---------- */
.ob{position:absolute;top:0;left:0;border:1.5px solid var(--c,var(--tag-el));border-radius:3px;opacity:0;z-index:2;will-change:transform,width,height;transition:transform 300ms var(--ease-out),width 300ms var(--ease-out),height 300ms var(--ease-out),opacity 220ms var(--ease),border-color 220ms var(--ease)}
.ob.show{opacity:1}
.ob.no-anim{transition:opacity var(--t1) var(--ease)}
.ob.hover{z-index:3;border-width:1.2px;border-style:dashed;border-color:var(--c)}
.ob.hover .tag{opacity:.95}
.ob .tag{position:absolute;left:-1.5px;bottom:100%;height:18px;padding:0 8px;display:flex;align-items:center;border-radius:5px 5px 0 0;background:var(--c,var(--tag-el));color:#fff;font-size:10.5px;font-weight:600;white-space:nowrap;letter-spacing:.01em;transform-origin:bottom left;transition:background 220ms var(--ease)}
.ob.hover .tag{opacity:.92}
.ob.tag-right .tag{left:auto;right:-1.5px}
.ob.sel{z-index:2}
.ob.sel .tag,.ob.hover .tag{animation:tagIn 280ms var(--ease-out) both}
@keyframes tagIn{from{transform:translateY(3px);opacity:0}to{transform:none;opacity:1}}
.ob.glimpse{animation:glimpse 1.5s var(--ease) both}
@keyframes glimpse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 8%,transparent)}45%{box-shadow:0 0 0 8px transparent;background:color-mix(in srgb,var(--c) 5%,transparent)}85%{opacity:1}100%{box-shadow:0 0 0 8px transparent;background:transparent;opacity:0}}
.ob.sel.pulse{animation:selPulse .7s var(--ease) both}
@keyframes selPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 35%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.abar{position:absolute;top:0;left:0;display:flex;align-items:center;gap:2px;padding:3px;border-radius:7px;background:#fff;box-shadow:0 6px 18px -6px rgba(24,34,54,.3),0 0 0 1px var(--line-2);pointer-events:none;opacity:0;transform-origin:top center;transition:opacity 220ms var(--ease),transform 320ms var(--ease-out);z-index:4}
.abar.show{opacity:1;pointer-events:auto}
.abar .icon-btn{width:26px;height:26px}
.abar .icon-btn.del:hover{background:var(--err-bg);color:var(--red)}
.abar .abar-sep{width:1px;height:14px;background:var(--line-2);margin:0 2px}
.dismiss{position:absolute;top:0;left:0;width:26px;height:26px;border-radius:6px;background:#fff;box-shadow:0 0 0 1px var(--line-2),0 3px 8px -3px rgba(24,34,54,.18);display:grid;place-items:center;color:var(--ink);pointer-events:none;opacity:0;transition:opacity var(--t1),transform var(--t2) var(--ease-out),background var(--t1),color var(--t1)}
.dismiss.show{opacity:1;pointer-events:auto}
.dismiss:hover{background:var(--err-bg);color:var(--red)}
.hatch{position:absolute;top:0;left:0;background:repeating-linear-gradient(-45deg,var(--hatch) 0 2.5px,var(--hatch-bg) 2.5px 7px);opacity:0;transition:opacity var(--t1),transform var(--t2) var(--ease-out),width var(--t2) var(--ease-out),height var(--t2) var(--ease-out);display:flex;align-items:center;justify-content:center;min-width:1px;min-height:1px}
.hatch.show{opacity:.95}
.hatch .pill{background:var(--hatch-pill);color:#fff;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap;box-shadow:0 2px 6px -2px rgba(108,57,184,.5)}
.addsec{position:absolute;top:0;left:0;height:0;pointer-events:none;opacity:0;transition:opacity var(--t1)}
.addsec{z-index:5}
.addsec.show{opacity:1;pointer-events:auto;transition:opacity 180ms var(--ease)}
.addsec:not(.show){transition:opacity 140ms var(--ease-out)}
.addsec .line{position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--blue-2);border-radius:2px;transform:scaleX(.6);transition:transform var(--t2) var(--ease-out)}
.addsec.show .line{transform:none}
.addsec .btns{position:absolute;left:50%;top:0;transform:translate(-50%,-50%) scale(.8);display:flex;gap:2px;padding:2px;background:#fff;border-radius:6px;box-shadow:0 0 0 1px var(--line-2),0 4px 12px -4px rgba(24,34,54,.25);transition:transform var(--t2) var(--spring)}
.addsec.show .btns{transform:translate(-50%,-50%) scale(1)}
.addsec .btns .icon-btn{width:24px;height:24px}
.addsec .btns .icon-btn.plus{color:var(--blue)}
.dropline{position:absolute;top:0;left:0;height:2px;background:var(--tag-el);border-radius:2px;opacity:0;transition:transform var(--t1) var(--ease-out),width var(--t1) var(--ease-out),opacity var(--t1)}
.dropline.show{opacity:1}
.dropline::before,.dropline::after{content:"";position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid var(--tag-el)}
.dropline::before{left:-4px}.dropline::after{right:-4px}
.dropsec{position:absolute;top:0;left:0;height:0;border-top:1.5px dotted var(--tag-el);opacity:0;transition:transform var(--t1) var(--ease-out),opacity var(--t1)}
.dropsec.show{opacity:1}
.dropsec span{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);background:var(--tag-el);color:#fff;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 10px -4px rgba(30,83,189,.6);animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,calc(-50% - 2px))}}
.ghost{position:fixed;top:0;left:0;z-index:300;pointer-events:none;will-change:transform;transition:opacity var(--t1)}
.ghost-chip{display:flex;align-items:center;gap:6px;padding:7px 12px 7px 8px;background:#fff;border-radius:6px;box-shadow:0 8px 22px -8px rgba(24,34,54,.38),0 0 0 1px var(--line-2);font-size:12.5px;color:var(--ink);white-space:nowrap;animation:chipIn 240ms var(--ease-out) both}
.ghost-chip svg{color:#9A9DB0}
@keyframes chipIn{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.ghost-card{transform:rotate(-2.5deg) scale(1.03);box-shadow:0 18px 40px -12px rgba(24,34,54,.35),0 0 0 1px var(--blue);border-radius:6px;background:var(--blue-soft);animation:ghostIn var(--t2) var(--spring) both}
@keyframes ghostIn{from{transform:rotate(0) scale(.9);opacity:.4}to{transform:rotate(-2.5deg) scale(1.03);opacity:1}}
.ghost.drop-out{opacity:0}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none!important}

/* ---------- Tooltip / toast / modal ---------- */
.tip{position:fixed;top:0;left:0;z-index:400;pointer-events:none;background:var(--tip);color:#fff;font-size:12px;font-weight:500;line-height:1.3;padding:6px 9px;border-radius:6px;white-space:nowrap;opacity:0;transform:translateY(3px) scale(.97);transition:opacity 110ms var(--ease),transform 160ms var(--ease-out);box-shadow:0 6px 16px -6px rgba(24,34,54,.4)}
.tip.show{opacity:1;transform:none}
.tip kbd{font-family:var(--font);font-size:10.5px;color:#B9BCD0;margin-left:6px}
.tip::after{content:"";position:absolute;left:var(--ax,50%);width:8px;height:8px;background:var(--tip);transform:translateX(-50%) rotate(45deg);border-radius:1px}
.tip.pos-top::after{bottom:-3px}
.tip.pos-bottom::after{top:-3px}
.tip.pos-right::after{left:-3px;top:50%;transform:translateY(-50%) rotate(45deg)}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:350;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;background:var(--tip);color:#fff;padding:9px 10px 9px 14px;border-radius:8px;font-size:12.5px;box-shadow:0 12px 28px -10px rgba(24,34,54,.5);pointer-events:auto;animation:toastIn var(--t3) var(--spring) both}
.toast.out{animation:toastOut var(--t2) var(--ease) both}
.toast .t-ico{color:#5FD3A0}
.toast button{color:#9DBBFF;font-weight:600;padding:3px 6px;border-radius:4px}
.toast button:hover{background:rgba(255,255,255,.08)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.97)}}
.modal-back{position:fixed;inset:0;z-index:500;background:rgba(24,34,54,.38);display:grid;place-items:center;animation:fadeIn var(--t2) var(--ease) both;backdrop-filter:blur(2px)}
.modal{width:min(400px,calc(100vw - 32px));background:#fff;border-radius:10px;padding:22px 22px 18px;box-shadow:0 24px 64px -16px rgba(24,34,54,.45);animation:modalIn var(--t3) var(--spring) both}
.modal h2{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--ink)}
.modal p{margin:0 0 20px;font-size:13px;line-height:1.55;color:var(--text)}
.modal-acts{display:flex;justify-content:flex-end;gap:8px}
.modal-back.out{animation:fadeOut var(--t2) var(--ease) both}
.modal-back.out .modal{animation:modalOut var(--t2) var(--ease) both}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes modalOut{to{opacity:0;transform:scale(.97)}}
@keyframes fadeOut{to{opacity:0}}

/* ---------- Responsive ---------- */
@media (max-width:1180px){:root{--panel-w:308px}}
@media (max-width:820px){
  :root{--panel-w:100vw}
  body{overflow:auto}
  .body{grid-template-columns:1fr;grid-template-rows:1fr 58px;position:relative}
  .rail{grid-row:2;flex-direction:row;justify-content:space-around;padding:4px 0}
  .rail-item{flex:1}
  .panel{position:absolute;left:0;right:0;bottom:58px;height:58vh;z-index:40;border-right:0;border-top:1px solid var(--line);border-radius:12px 12px 0 0;box-shadow:0 -12px 32px -12px rgba(24,34,54,.25);transform:translateY(calc(100% + 60px));transition:transform var(--t3) var(--ease-out)}
  .body.sheet-open .panel{transform:none}
  .canvas{grid-row:1}
  .doc-title{max-width:40vw}
  .stage{padding:32px 16px 90px}
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}
}

</style>
