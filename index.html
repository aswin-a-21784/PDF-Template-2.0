<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Procurement · Blanket Purchase Orders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar"></aside>

      <div class="main-col">
        <header class="topbar">

            <span class="app-crumb-icon">&#9635;</span>
            <span class="app-crumb">Procurement</span>
          </div>

            <span class="search-icon">&#128269;</span>

          <div class="topbar-right">
            <button class="org-switch">AS Aquarium <span>&#9662;</span></button>
            <button class="icon-btn icon-btn-primary" title="Create">+</button>
            <button class="icon-btn" title="Notifications">&#128276;</button>
            <button class="icon-btn" title="Settings">&#9881;</button>
            <span class="avatar">A</span>
            <button class="icon-btn" title="Apps">&#8942;&#8942;</button>
          </div>
        </header>

        <main id="page-root" class="page-root"></main>
      </div>
    </div>

    <div id="overlay-root"></div>
    <div id="toast-root"></div>

    <script type="module" src="/src/app.js"></script>
